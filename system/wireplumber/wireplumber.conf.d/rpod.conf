# /etc/wireplumber/wireplumber.conf.d/rpod.conf -- the `rpod` profile run by
# system/systemd/wireplumber.service (docs/PLAN.md §6.3).
#
# PipeWire exists on rPod only to carry MPD's "Bluetooth" output to a BlueZ
# A2DP headset. The headphone jack / DAC stays MPD -> ALSA hw: direct
# (bit-perfect, §6.2), so WirePlumber must never open ALSA devices itself: it
# would hold the card MPD's own ALSA output needs, and add a resampling hop.

wireplumber.profiles = {
  rpod = {
    # Upstream's systemwide profile (no logind seat, no session bus), without
    # saved state: MPD already keeps volume and output selection, and the
    # rootfs goes read-only in Phase 7.
    inherits = [ main-embedded ]

    hardware.audio = disabled
    hardware.video-capture = disabled
    monitor.bluez-midi = disabled
  }
}
