# /etc/wireplumber/wireplumber.conf.d/rpod.conf -- the `rpod` profile run by
# system/systemd/wireplumber.service (docs/PLAN.md §6.3).
#
# PipeWire exists on rPod only to carry MPD's "Bluetooth" output to a BlueZ
# A2DP headset. The headphone jack / DAC stays MPD -> ALSA hw: direct
# (bit-perfect, §6.2), so WirePlumber must never open ALSA devices itself: it
# would hold the card MPD's own ALSA output needs, and add a resampling hop.

wireplumber.profiles = {
  rpod = {
    # Upstream's systemwide profile (no logind seat, no session bus), without
    # saved state: MPD already keeps volume and output selection, and the
    # rootfs goes read-only in Phase 7.
    inherits = [ main-embedded ]

    hardware.audio = disabled
    hardware.video-capture = disabled
    monitor.bluez-midi = disabled
  }
}

wireplumber.settings = {
  # The volume a newly connected headset's sink starts at -- with no saved
  # state, on every connect. That makes it the ceiling for MPD's software
  # mixer, which is the one volume control (system/mpd/). PipeWire sends the
  # headset cbrt(volume) as its AVRCP absolute volume, so this is a fraction
  # of the headset's *own* volume scale, cubed. Calibrated on AirPods Pro so
  # the wheel tracks an iPhone's volume slider through normal listening
  # levels: iPhone 4-6 of 16 (AirPods at 25-37%) sounds like wheel clicks
  # 6-10 (24-40%), assuming the AirPods' scale spans ~60 dB evenly (which fit
  # every level reported by ear). Upstream's 0.064 (40%) put those levels at
  # the wheel's very top ("high not that high"); 1.0 (100%) pushed them down
  # to its bottom two clicks. 0.421875 = 0.75^3, i.e. 75%: the wheel's 100%
  # is about an iPhone's 12 of 16.
  device.routes.default-sink-volume = 0.421875
}
