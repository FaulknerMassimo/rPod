# /etc/mpd.conf for rPod (docs/PLAN.md §6.2) -- Pi 3B breadboard dev board.
#
# No DAC yet, so this plays through the 3B's own headphone jack. Once the
# PCM5102A is wired, replace the "Headphones" output with PLAN §6.2's "DAC"
# block (hw:CARD=sndrpihifiberry, auto_* off for bit-perfect output).
#
# Run by Debian's stock mpd.service with mpd.socket MASKED: the socket unit
# also listens on TCP 6600, and PLAN §6.1 wants a Unix socket only. Debian's
# tmpfiles rule creates /run/mpd owned by mpd, so both the socket and the
# visualizer fifo below can live there -- they're rpod's defaults
# (RPOD_MPD_SOCKET, RPOD_VIS_FIFO in src/main.c).

music_directory    "/media/music"
playlist_directory "/var/lib/mpd/playlists"
db_file            "/var/lib/mpd/tag_cache"
state_file         "/var/lib/mpd/state"
sticker_file       "/var/lib/mpd/sticker.sql"

user               "mpd"
bind_to_address    "/run/mpd/socket"
# Nothing to advertise: there's no network listener.
zeroconf_enabled   "no"

# Pick up files copied into /media/music without an explicit `mpc update`.
auto_update        "yes"
restore_paused     "yes"
filesystem_charset "UTF-8"

audio_output {
    type        "alsa"
    name        "Headphones"
    device      "hw:CARD=Headphones,DEV=0"
    mixer_type  "software"
}

# Bluetooth (docs/PLAN.md §6.3): plays into the system-wide PipeWire instance
# (system/systemd/pipewire.service), whose WirePlumber exposes whichever A2DP
# headset BlueZ has connected as the default sink. Off by default -- switch to
# it in Settings > Audio Output (or `mpc enable Bluetooth`) once a headset is
# paired and connected. The mpd user reaches this socket through its pipewire
# group membership (system/bluetooth/setup.sh).
#
# Software mixer, same as Headphones: the pipewire mixer maps volume to a
# cubic stream gain (4% = -84 dB, 25% = -36 dB), so the bottom quarter of the
# wheel was inaudible. MPD's own curve is ~1.5 dB per 4% step, with 4% at
# -50 dB. The headset's own volume is pinned at a fixed ceiling (WirePlumber's
# default-sink-volume in system/wireplumber/), so this is the only control.
audio_output {
    type        "pipewire"
    name        "Bluetooth"
    remote      "/run/pipewire/pipewire-0"
    mixer_type  "software"
    enabled     "no"
}

# Raw PCM tap for the Now Playing visualizer (src/audio/visualizer.c). Format
# must match RPOD_VIS_SAMPLE_RATE/RPOD_VIS_CHANNELS in visualizer.h.
audio_output {
    type    "fifo"
    name    "Visualizer feed"
    path    "/run/mpd/visualizer.fifo"
    format  "44100:16:2"
}

decoder {
    plugin  "hybrid_dsd"
    enabled "no"
}
decoder {
    plugin  "wildmidi"
    enabled "no"
}
