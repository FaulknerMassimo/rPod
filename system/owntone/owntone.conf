# /etc/owntone.conf for rPod (docs/PLAN.md §6.3b).
#
# OwnTone is only here to speak AirPlay 2: HomePods and Apple TVs turn
# PipeWire's AirPlay 1 away (403 Forbidden). It isn't rPod's music server:
# MPD plays the library, and its "AirPlay feed" fifo output
# (system/mpd/mpd.conf) is the one thing OwnTone plays, to the speaker rPod's
# "Play On" list selects over OwnTone's JSON API (src/audio/sinks.c).
# system/owntone/setup.sh installs it; the package's owntone.service runs it.

general {
	# Made by setup.sh: the package makes no user of its own.
	uid = "owntone"
	# Also goes to the journal (owntone.service runs it in the foreground).
	loglevel = warning
	# The API and web UI are rpod's alone. With no admin_password nothing
	# else gets in, from the network or anywhere.
	trusted_networks = { "localhost" }
	websocket_port = 0
	# The Pi has no IPv6 address on this Wi-Fi: a speaker reached by its
	# IPv6 one would never connect.
	ipv6 = no
	# HomePods and Apple TVs on OS 27 answer 403 Forbidden to anything that
	# doesn't call itself AirPlay -- OwnTone's own "OwnTone/29.3" included.
	# OwnTone 29.3 sends this one to speakers; later ones send this value
	# from airplay_shared by default (upstream 34603ba9, issue #2042).
	user_agent = "AirPlay/999.0.0"
	# How far ahead of a speaker playing OwnTone sends (2250 by default, for
	# old AirPort Expresses): a speaker starts this much sooner. Change
	# RPOD_SINKS_AIRPLAY_DELAY_MS (src/audio/sinks.h) with it.
	start_buffer_ms = 1000
}

library {
	name = "rPod"
	port = 3689
	# Only the feed's folder (system/tmpfiles.d/rpod-airplay.conf): OwnTone
	# plays every fifo in the folders it's given.
	directories = { "/run/mpd/airplay" }
	follow_symlinks = false
	# Play the feed when sound arrives, to the selected speaker, and stop when
	# it dries up. sinks.c only turns MPD's feed on while a speaker is
	# selected. MPD writes 44100:16:2, OwnTone's default pipe format.
	pipe_autostart = true
}

# No local audio: the headset gets its sound from MPD through PipeWire.
audio {
	nickname = "rPod"
	type = "disabled"
}

# OwnTone's own MPD server would listen on TCP 6600 for anyone on the network.
mpd {
	port = 0
}

# Its player thread writes the database as playback starts: with WAL and
# NORMAL a write doesn't wait on the SD card, and a power cut still can't
# corrupt it (it holds the Apple TV's pairing).
sqlite {
	pragma_journal_mode = "WAL"
	pragma_synchronous = 1
}
