# /etc/systemd/system/owntone.service.d/rpod.conf (system/owntone/setup.sh).
[Unit]
# MPD makes the feed's fifo when it starts (system/mpd/mpd.conf), and
# OwnTone's library scan looks for it when it does.
After=mpd.service

[Service]
# A deadlocked OwnTone (rpod-owntone-watchdog.service) never gets through
# its own shutdown: kill it after 10 s, not systemd's 90.
TimeoutStopSec=10
