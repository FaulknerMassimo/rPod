# The folder OwnTone reads MPD's "AirPlay feed" from (system/owntone/): its
# own, because OwnTone plays every fifo in the folder it's given and /run/mpd
# also holds the visualizer's. airplay.pipe itself is MPD's to make; the
# .metadata fifo is the one OwnTone looks for beside any pipe (without it,
# it logs about it in a loop).
d /run/mpd/airplay 0755 mpd audio -
p /run/mpd/airplay/airplay.pipe.metadata 0644 mpd audio -
